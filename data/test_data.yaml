# ============================================================
# 测试数据文件
# 用于数据驱动测试（配合 @pytest.mark.parametrize 使用）
#
# 面试考点：为什么用 YAML 存测试数据？
# 1. 可读性好，非技术人员也能编辑
# 2. 支持注释，方便标注数据用途
# 3. 层级结构清晰
# 4. 可以将敏感数据单独管理（.gitignore 忽略）
# ============================================================

# ---- 导航链接测试数据 ----
# 用于 test_navigation.py 的 test_navigate_to_page 参数化测试
