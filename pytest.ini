# ============================================================
# pytest 全局配置文件
# pytest 启动时会自动读取此文件，无需手动指定
# ============================================================

[pytest]
# ---- 测试文件发现规则 ----
# pytest 默认查找 test_*.py 或 *_test.py 文件
python_files = test_*.py

# 测试类和函数的命名规则
python_classes = Test*
python_functions = test_*

# 测试文件所在目录
testpaths = tests

# ---- 命令行默认参数 ----
# -v: 显示详细输出（每个测试的 PASS/FAIL）
# -s: 允许 print() 输出到控制台（调试时有用）
# --tb=short: 失败时显示简短的 traceback
addopts = -v -s --tb=short

# ---- 自定义标记（markers）----
# 用于给测试分类，运行时可以用 -m 筛选
# 例如: pytest -m smoke    # 只跑冒烟测试
#       pytest -m "not slow" # 跳过慢速测试
markers =
    smoke: 冒烟测试 - 验证核心功能是否正常，每次提交必跑
    regression: 回归测试 - 完整功能验证，发版前跑
    slow: 慢速测试 - 需要较长时间执行的测试
    home: 首页相关测试
    culture: 非遗文化页测试
    inheritors: 传承人页测试
    events: 活动页测试
    mall: 商城页测试
    community: 社区页测试
    notifications: 通知页测试

# ---- 日志配置 ----
# 测试运行时自动捕获日志，失败时输出
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 同时写入日志文件
log_file = logs/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
